name: Bug report
description: Something does not work as documented (NOT a security vulnerability: see SECURITY.md)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste real passwords, tokens or full URLs with query strings. Security problems: use private vulnerability reporting, not this form."
  - type: input
    id: version
    attributes: { label: "hallpass --version", placeholder: "1.3.0" }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: "OS and Node version", placeholder: "Windows 11, Node 22" }
    validations: { required: true }
  - type: input
    id: ab
    attributes: { label: "agent-browser version", placeholder: "0.39.2" }
  - type: input
    id: client
    attributes: { label: "AI tool / client (and how connected: CLI, MCP, plugin)", placeholder: "Claude Code via plugin" }
  - type: textarea
    id: what
    attributes: { label: "What happened, and what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: output
    attributes: { label: "Output of `hallpass doctor` and the failing command (redact anything sensitive)", render: shell }
